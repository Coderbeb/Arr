services:
  - type: web
    name: arr-wallet
    env: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: arr-wallet-db
          property: connectionString
      - key: LOG_CHANNEL
        value: stderr
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false

databases:
  - name: arr-wallet-db
    databaseName: arrwallet
    user: arrwallet
    plan: free
